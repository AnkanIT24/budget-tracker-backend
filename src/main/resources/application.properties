spring.datasource.url=jdbc:mysql://localhost:3306/budget_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=budget_local_dev_secret_key_min_32_chars_ok
app.jwt.expiration-ms=86400000

server.port=8080
server.address=0.0.0.0

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# ---------- Password reset ----------
# Where the reset link points. Set APP_FRONTEND_URL on Render to your Vercel URL.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.reset.expiry-minutes=30
app.mail.from=${MAIL_USERNAME:}

# ---------- SMTP (Gmail) ----------
# MAIL_PASSWORD must be a Gmail App Password, not the account password.
# Requires 2-Step Verification enabled on the Google account.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
