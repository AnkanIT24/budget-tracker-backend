
# ==========================================
# DATABASE - RENDER
# ==========================================

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP - Render
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3

# ==========================================
# JWT SECURITY
# ==========================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ==========================================
# SERVER
# ==========================================

server.port=${PORT:8080}
server.address=0.0.0.0

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# ==========================================
# PASSWORD RESET
# ==========================================

app.frontend-url=${APP_FRONTEND_URL}
app.reset.expiry-minutes=30
app.mail.from=${MAIL_USERNAME}

# ==========================================
# GMAIL SMTP
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ==========================================
# GOOGLE GEMINI AI
# ==========================================

spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.chat.options.temperature=0.2
